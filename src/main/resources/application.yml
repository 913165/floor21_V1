spring:
  application:
    name: floor21
  profiles:
    default: dev

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 25MB

  datasource:
    url: jdbc:postgresql://localhost:5432/floor21_db
    username: floor21_user
    password: floor21_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8

  security:
    filter:
      order: 10

server:
  port: 80
  servlet:
    context-path: /floor21
    session:
      timeout: 3600s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

floor21:
  session:
    timeout: 3600
  vault:
    unlock-timeout-minutes: 15
  expenses:
    unlock-timeout-minutes: 15
  app:
    name: Floor21
    version: 1.0.0
  upload-root: ${FLOOR21_UPLOAD_ROOT:${user.home}/.floor21/uploads}
