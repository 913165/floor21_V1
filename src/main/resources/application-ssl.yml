# Ubuntu HTTPS for floor21.in — activate with: -Dspring-boot.run.profiles=prod,ssl
# Uses PKCS12 keystore at /home/tinumistry/floor21.p12 (create once on the server).
server:
  port: 443
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:/home/tinumistry/floor21.p12}
    key-store-password: '${SSL_KEY_STORE_PASSWORD:Varsha1#}'
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:floor21}
