# Ubuntu HTTPS for floor21.in — activate with: -Dspring-boot.run.profiles=prod,ssl
#
# Certbot certs: /etc/letsencrypt/live/floor21.in/
# Copy to ~/ssl/ (see docs/UBUNTU_SETUP.md) — Java cannot read /etc/letsencrypt/ directly.
spring:
  ssl:
    bundle:
      pem:
        webserver:
          reload-on-update: true
          keystore:
            certificate: ${SSL_CERTIFICATE:file:/home/tinumistry/ssl/fullchain.pem}
            private-key: ${SSL_PRIVATE_KEY:file:/home/tinumistry/ssl/privkey.pem}

server:
  port: 443
  ssl:
    bundle: webserver
