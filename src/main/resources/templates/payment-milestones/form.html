<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Milestone</h1>
  <form class="card card-body shadow-sm" th:action="@{/payment-milestones/save}" th:object="${template}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Sort order</label>
        <input class="form-control" type="number" th:field="*{sortOrder}" required min="0"/>
      </div>
      <div class="col-md-3">
        <label class="form-label">Suggested % (optional)</label>
        <input class="form-control" type="number" step="0.01" th:field="*{suggestedPercent}" min="0" max="100"/>
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{active}"/>
          <label class="form-check-label">Active</label>
        </div>
      </div>
      <div class="col-12">
        <label class="form-label">Milestone description</label>
        <textarea class="form-control" rows="3" th:field="*{milestoneLabel}" required maxlength="800"
                  placeholder="e.g. On completion of the plinth work of the building"></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/payment-milestones}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
