<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Change docs locker PIN</h1>
  <form class="card card-body shadow-sm col-lg-5" th:action="@{/docs-locker/change-pin}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <p class="small text-muted" th:unless="${pinConfigured}">
      Create your docs locker PIN (4–8 digits). It must be <strong>different</strong> from the vault PIN.
    </p>

    <div class="mb-3" th:if="${pinConfigured}">
      <label class="form-label">Current PIN</label>
      <input class="form-control" type="password" name="currentPin" inputmode="numeric" pattern="[0-9]{4,8}"
             maxlength="8" required/>
    </div>
    <div class="mb-3" th:unless="${pinConfigured}">
      <label class="form-label">Account password</label>
      <input class="form-control" type="password" name="accountPassword" autocomplete="current-password" required/>
      <div class="form-text">Your login password — required to create the first docs locker PIN.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="${pinConfigured} ? 'New PIN' : 'Docs locker PIN'">New PIN</label>
      <input class="form-control" type="password" name="newPin" inputmode="numeric" pattern="[0-9]{4,8}"
             maxlength="8" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm PIN</label>
      <input class="form-control" type="password" name="confirmPin" inputmode="numeric" pattern="[0-9]{4,8}"
             maxlength="8" required/>
    </div>
    <button class="btn btn-primary" type="submit" th:text="${pinConfigured} ? 'Update PIN' : 'Create PIN'">Update PIN</button>
    <a class="btn btn-link" th:href="@{/docs-locker}">Cancel</a>
  </form>
</div>
</body>
</html>
