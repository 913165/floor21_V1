<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">Slabs</h1>
    <a class="btn btn-primary" th:href="@{/slabs/new}">New slab</a>
  </div>
  <div class="table-responsive card shadow-sm">
    <table class="table mb-0">
      <thead><tr><th>Name</th><th>Building</th><th>Rate / sqft</th><th></th></tr></thead>
      <tbody>
      <tr th:each="s : ${slabs}">
        <td th:text="${s.slabName}"></td>
        <td th:text="${s.building != null ? s.building.buildingName : '—'}"></td>
        <td th:text="${s.ratePerSqft}"></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/slabs/{id}/edit(id=${s.id})}">Edit</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
