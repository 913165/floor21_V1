<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <p class="text-muted small">Floor21 platform admin only. Partners use <strong>Milestone setup (Clients)</strong> and <strong>Payment schedule (Clients)</strong> for per-buyer instalments.</p>
  <h1 class="h3 mb-4" th:text="${pageTitle}">Slab</h1>
  <form class="card card-body shadow-sm" th:action="@{/admin/builder-pricing-slabs/save}" th:object="${slab}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" th:field="*{builder.id}"/>
    <input type="hidden" th:field="*{building.id}"/>
    <input type="hidden" name="buildingId" th:value="${selectedBuildingId}" th:if="${selectedBuildingId != null}"/>
    <input type="hidden" name="projectId" th:if="${filterProjectId != null}" th:value="${filterProjectId}"/>
    <input type="hidden" name="q" th:if="${filterSearch != null and !#strings.isEmpty(filterSearch)}" th:value="${filterSearch}"/>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Building</label>
        <p class="form-control-plaintext fw-semibold mb-0"
           th:text="${selectedBuilding != null ? selectedBuilding.buildingName : '—'}">Building</p>
      </div>
      <div class="col-md-6">
        <label class="form-label">Slab name</label>
        <input class="form-control" th:field="*{slabName}"/>
      </div>
      <div class="col-md-4">
        <label class="form-label">Percent (%)</label>
        <input class="form-control" type="number" step="0.01" min="0" max="100" th:field="*{suggestedPercent}"/>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{active}"/>
          <label class="form-check-label">Active</label>
        </div>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit" th:disabled="${selectedBuildingId == null}">Save</button>
      <a class="btn btn-link"
         th:href="@{/admin/builder-pricing-slabs(projectId=${filterProjectId}, q=${filterSearch}, buildingId=${selectedBuildingId})}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
