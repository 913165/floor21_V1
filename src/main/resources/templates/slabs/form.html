<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <p class="text-muted small">Floor21 platform admin only. Builders use platform <strong>Payment milestones</strong> (admin menu) and <strong>Slabs (payment schedule)</strong> for instalments.</p>
  <h1 class="h3 mb-4" th:text="${pageTitle}">Slab</h1>
  <form class="card card-body shadow-sm" th:action="@{/admin/builder-pricing-slabs/save}" th:object="${slab}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Builder <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{builder.id}" required>
          <option value="">Select builder…</option>
          <option th:each="br : ${builders}" th:value="${br.id}" th:text="${br.companyName}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Slab name</label>
        <input class="form-control" th:field="*{slabName}"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Building (optional)</label>
        <select class="form-select" th:field="*{building.id}">
          <option value="">Any / none</option>
          <option th:each="b : ${buildings}" th:value="${b.id}"
                  th:text="${b.builder != null ? (b.buildingName + ' — ' + b.builder.companyName) : b.buildingName}"></option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="2" th:field="*{description}"></textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Rate per sqft</label>
        <input class="form-control" type="number" step="0.01" th:field="*{ratePerSqft}"/>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{active}"/>
          <label class="form-check-label">Active</label>
        </div>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/admin/builder-pricing-slabs}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
