<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content" th:with="dfmt=${T(com.floor21.util.Floor21DateFormatter)}">
  <h1 class="h3 mb-2" th:text="${pageTitle}">Broker bookings</h1>
  <p class="text-muted" th:text="${broker.fullName}"></p>
  <div class="table-responsive card shadow-sm">
    <table class="table mb-0">
      <thead><tr><th>Code</th><th>Date</th><th>Client</th><th>Unit</th><th>Type</th></tr></thead>
      <tbody>
      <tr th:each="b : ${bookings}">
        <td><a th:href="@{/bookings/{id}(id=${b.id})}" th:text="${b.bookingCode}"></a></td>
        <td th:text="${dfmt.formatDisplay(b.bookingDate)}"></td>
        <td th:text="${b.client.displayName()}"></td>
        <td>
          <a th:if="${b.flat != null and b.flat.building != null}"
             class="link-primary"
             th:href="@{/buildings/{bid}/flats(bid=${b.flat.building.id},focusFlat=${b.flat.id})}"
             th:text="${b.flat.flatNumber}">0802</a>
          <span th:if="${b.flat == null or b.flat.building == null}"
                th:text="${b.flat != null ? b.flat.flatNumber : '—'}">—</span>
        </td>
        <td>
          <span th:if="${b.flat != null and T(com.floor21.util.FlatUnitTypes).isShopCode(b.flat.bhkType)}"
                class="badge rounded-pill text-bg-info">Shop</span>
          <span th:if="${b.flat != null and !T(com.floor21.util.FlatUnitTypes).isShopCode(b.flat.bhkType) and b.flat.bhkType != null}"
                class="badge rounded-pill text-bg-secondary"
                th:text="${b.flat.bhkType}">2BHK</span>
          <span th:if="${b.flat == null or (b.flat.bhkType == null and !T(com.floor21.util.FlatUnitTypes).isShopCode(b.flat.bhkType))}"
                class="text-muted">—</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="5" class="text-muted">No bookings</td></tr>
      </tbody>
    </table>
  </div>
  <a class="btn btn-link" th:href="@{/brokers}">Back</a>
</div>
</body>
</html>
