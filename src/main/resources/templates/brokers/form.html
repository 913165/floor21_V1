<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Broker</h1>
  <form class="card card-body shadow-sm" th:action="@{/brokers/save}" th:object="${broker}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full name</label>
        <input class="form-control" th:field="*{fullName}" required/>
      </div>
      <div class="col-md-3">
        <label class="form-label">Phone</label>
        <input class="form-control" th:field="*{phone}"/>
      </div>
      <div class="col-md-3">
        <label class="form-label">Email</label>
        <input class="form-control" th:field="*{email}"/>
      </div>
      <div class="col-md-3">
        <label class="form-label">Commission %</label>
        <input class="form-control" type="number" step="0.01" th:field="*{commissionPct}"/>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/brokers}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
