<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">Brokers</h1>
    <a class="btn btn-primary" th:href="@{/brokers/new}">New broker</a>
  </div>
  <div class="table-responsive card shadow-sm">
    <table class="table table-hover mb-0">
      <thead><tr><th>Name</th><th>Phone</th><th>Commission %</th><th></th></tr></thead>
      <tbody>
      <tr th:each="b : ${brokers}">
        <td th:text="${b.fullName}"></td>
        <td th:text="${b.phone}"></td>
        <td th:text="${b.commissionPct}"></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/brokers/{id}/bookings(id=${b.id})}">Bookings</a>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/brokers/{id}/edit(id=${b.id})}">Edit</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
