<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Cancel booking</h1>
  <div class="card shadow-sm mb-3"><div class="card-body">
    <div class="text-muted small">Booking</div>
    <div th:text="${booking.bookingCode}"></div>
    <div class="text-muted small mt-2">Client / Flat</div>
    <div th:text="${booking.client.displayName() + ' — ' + booking.flat.flatNumber}"></div>
  </div></div>
  <form class="card card-body shadow-sm" th:action="@{/bookings/{id}/cancel/confirm(id=${booking.id})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="mb-3">
      <label class="form-label">Cancel date</label>
      <input class="form-control" type="date" name="cancelDate" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Reason</label>
      <textarea class="form-control" name="reason" rows="3"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Refund amount</label>
      <input class="form-control" type="number" step="0.01" name="refundAmount" value="0"/>
    </div>
    <button class="btn btn-danger" type="submit">Confirm cancellation</button>
    <a class="btn btn-link" th:href="@{/bookings/{id}(id=${booking.id})}">Back</a>
  </form>
</div>
</body>
</html>
