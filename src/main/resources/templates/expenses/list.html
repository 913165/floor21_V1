<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h3 mb-0" th:text="${pageTitle}">Expenses</h1>
      <div class="text-muted small" th:text="${booking.bookingCode}"></div>
    </div>
    <a class="btn btn-primary" th:href="@{/bookings/{id}/expenses/new(id=${booking.id})}">New expense</a>
  </div>
  <div class="table-responsive card shadow-sm">
    <table class="table mb-0">
      <thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead>
      <tbody>
      <tr th:each="e : ${expenses}">
        <td th:text="${e.expenseDate}"></td>
        <td th:text="${e.description}"></td>
        <td th:text="${e.amount}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(expenses)}"><td colspan="3" class="text-muted">No expenses</td></tr>
      </tbody>
    </table>
  </div>
  <a class="btn btn-link" th:href="@{/bookings/{id}(id=${booking.id})}">Back to booking</a>
</div>
</body>
</html>
