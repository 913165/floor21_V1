<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Expense</h1>
  <form class="card card-body shadow-sm" th:action="@{/bookings/{id}/expenses/save(id=${booking.id})}" th:object="${expense}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Date</label>
        <input class="form-control" type="date" th:field="*{expenseDate}"/>
      </div>
      <div class="col-md-4">
        <label class="form-label">Amount</label>
        <input class="form-control" type="number" step="0.01" th:field="*{amount}"/>
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <input class="form-control" th:field="*{description}"/>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/bookings/{id}/expenses(id=${booking.id})}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
