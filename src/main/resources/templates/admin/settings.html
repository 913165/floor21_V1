<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content" th:with="s=${settings}">
  <h1 class="h3 mb-4" th:text="${pageTitle}">System settings</h1>
  <p class="text-muted small">Platform support and receipt defaults. Vault is configured on
    <a th:href="@{/admin/vault-config}">Vault config</a>.</p>
  <form class="card card-body shadow-sm col-lg-6" th:action="@{/admin/settings}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" name="default_expenses_enabled" value="true"
             th:checked="${s['default_expenses_enabled'] == 'true'}"/>
      <label class="form-check-label">Expenses hub enabled by default</label>
    </div>
    <div class="mb-3">
      <label class="form-label">Default receipt prefix</label>
      <input class="form-control" name="default_receipt_prefix" th:value="${s['default_receipt_prefix']}"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Support email</label>
      <input class="form-control" type="email" name="support_email" th:value="${s['support_email']}"/>
    </div>
    <button class="btn btn-primary" type="submit">Save settings</button>
  </form>
</div>
</body>
</html>
