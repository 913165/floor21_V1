<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">Builders</h1>
    <a class="btn btn-primary" th:href="@{/admin/projects/new}">New project</a>
  </div>
  
  <div class="table-responsive card shadow-sm">
    <table class="table mb-0">
      <thead>
      <tr>
        <th>Project</th>
        <th>City</th>
        <th>Layout</th>
        <th>Active</th>
        <th>Last login</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="b : ${builders}">
        <td th:text="${b.companyName()}"></td>
        <td th:text="${b.city() != null ? b.city() : '?'}"></td>
        <td>
          <span class="badge text-bg-success" th:if="${b.buildingCount() > 0}">Yes</span>
          <span class="badge text-bg-secondary" th:if="${b.buildingCount() == 0}">No</span>
        </td>
        <td>
          <span class="badge" th:classappend="${b.active()} ? 'text-bg-success' : 'text-bg-secondary'"
                th:text="${b.active()} ? 'Yes' : 'No'">?</span>
        </td>
        <td class="text-nowrap small" th:text="${b.lastLoginAt() != null ? #temporals.format(b.lastLoginAt(), 'dd MMM yyyy') : '?'}">?</td>
        <td class="text-end text-nowrap">
          <form class="d-inline" th:action="@{/admin/projects/{id}/impersonate(id=${b.id()})}" method="post" th:if="${b.active()}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm btn-warning" type="submit">Open as</button>
          </form>
          <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/projects/{id}/staff(id=${b.id()})}">Partners</a>
          <a class="btn btn-sm btn-outline-primary"
             th:if="${b.buildingCount() == 0}"
             th:href="@{/admin/projects/{id}/buildings/new(id=${b.id()})}">Generate project layout</a>
          <a class="btn btn-sm btn-outline-secondary"
             th:if="${b.layoutId() != null}"
             th:href="@{/buildings/{id}/edit(id=${b.layoutId()})}">Edit layout</a>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/projects/{id}/edit(id=${b.id()})}">Edit</a>
          <form class="d-inline"
                th:if="${b.layoutId() == null and b.partnerCount() == 0}"
                th:action="@{/admin/projects/{id}/delete(id=${b.id()})}" method="post"
                onsubmit="return confirm('Delete this project permanently? This cannot be undone.');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
