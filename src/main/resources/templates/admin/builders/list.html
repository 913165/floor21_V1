<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">Builders</h1>
    <a class="btn btn-primary" th:href="@{/admin/builders/new}">New builder</a>
  </div>
  
  <div class="table-responsive card shadow-sm">
    <table class="table mb-0">
      <thead>
      <tr>
        <th>Company</th>
        <th>Email</th>
        <th>City</th>
        <th>Buildings</th>
        <th>Active</th>
        <th>Last login</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="b : ${builders}">
        <td th:text="${b.companyName()}"></td>
        <td th:text="${b.email()}"></td>
        <td th:text="${b.city()}"></td>
        <td th:text="${b.buildingCount()}"></td>
        <td>
          <span class="badge" th:classappend="${b.active()} ? 'text-bg-success' : 'text-bg-secondary'"
                th:text="${b.active()} ? 'Yes' : 'No'">—</span>
        </td>
        <td class="text-nowrap small" th:text="${b.lastLoginAt() != null ? #temporals.format(b.lastLoginAt(), 'dd MMM yyyy') : '—'}">—</td>
        <td class="text-end text-nowrap">
          <form class="d-inline" th:action="@{/admin/builders/{id}/impersonate(id=${b.id()})}" method="post" th:if="${b.active()}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm btn-warning" type="submit">Open as</button>
          </form>
          <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/builders/{id}/staff(id=${b.id()})}">Staff</a>
          <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/builders/{id}/buildings/new(id=${b.id()})}">Add building</a>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/builders/{id}/edit(id=${b.id()})}">Edit</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
