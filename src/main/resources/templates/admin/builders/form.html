<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Project</h1>
  <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
  <p class="text-muted small mb-3" th:if="${builder.id == null}">
    Create the project first, then add login users under <a th:href="@{/admin/users}">User Management</a>.
  </p>
  <p class="text-muted small mb-3" th:if="${builder.id != null}">
  <a th:href="@{/admin/users/new(builderId=${builder.id})}">Add users</a> for this project.
  </p>
  <form class="card card-body shadow-sm" th:action="@{/admin/projects/save}" th:object="${builder}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Project name</label>
        <input class="form-control" th:field="*{companyName}" required/>
      </div>
      <div class="col-md-6">
        <label class="form-label">City</label>
        <input class="form-control" th:field="*{city}"/>
      </div>
      <div class="col-12">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{active}"/>
          <label class="form-check-label">Project active</label>
        </div>
      </div>
    </div>

    <div class="mt-3 d-flex flex-wrap align-items-center gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-primary"
         th:if="${builder.id != null}"
         th:href="@{/admin/projects/{id}/buildings/new(id=${builder.id})}">Generate project layout</a>
      <a class="btn btn-outline-primary"
         th:if="${builder.id != null}"
         th:href="@{/admin/users/new(builderId=${builder.id})}">Add users</a>
      <a class="btn btn-outline-primary"
         th:if="${builder.id != null}"
         th:href="@{/admin/projects/{id}/staff(id=${builder.id})}">Partners</a>
      <a class="btn btn-link" th:href="@{/admin/projects}">Cancel</a>
    </div>
  </form>
  <div class="mt-3 d-flex flex-wrap gap-2" th:if="${builder.id != null}">
    <form th:if="${builder.active}" th:action="@{/admin/projects/{id}/impersonate(id=${builder.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-warning" type="submit">Open as this project</button>
    </form>
    <form th:if="${builder.active}" th:action="@{/admin/projects/{id}/deactivate(id=${builder.id})}" method="post"
          onsubmit="return confirm('Deactivate this project? Users will not be able to sign in.');">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-outline-danger" type="submit">Deactivate</button>
    </form>
  </div>
</div>
</body>
</html>
