<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Builder</h1>
  <form class="card card-body shadow-sm" th:action="@{/admin/builders/save}" th:object="${builder}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    
    
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Company name</label>
        <input class="form-control" th:field="*{companyName}" required/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email (login)</label>
        <input class="form-control" type="email" th:field="*{email}" required/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="rawPassword" autocomplete="new-password"
               th:placeholder="${builder.id != null} ? 'Leave blank to keep current' : 'Required'"/>
      </div>
      <div class="col-md-3">
        <label class="form-label">City</label>
        <input class="form-control" th:field="*{city}"/>
      </div>
      <div class="col-md-3">
        <label class="form-label">Phone</label>
        <input class="form-control" th:field="*{phone}"/>
      </div>
      <div class="col-12">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{active}"/>
          <label class="form-check-label">Active</label>
        </div>
      </div>
    </div>
    <div class="mt-3 d-flex flex-wrap align-items-center gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-primary"
         th:if="${builder.id != null}"
         th:href="@{/admin/builders/{id}/buildings/new(id=${builder.id})}">Add building</a>
      <a class="btn btn-outline-primary"
         th:if="${builder.id != null}"
         th:href="@{/admin/builders/{id}/staff(id=${builder.id})}">Manage partners</a>
      <a class="btn btn-link" th:href="@{/admin/builders}">Cancel</a>
    </div>
  </form>
  <div class="mt-3 d-flex flex-wrap gap-2" th:if="${builder.id != null}">
    <form th:if="${builder.active}" th:action="@{/admin/builders/{id}/impersonate(id=${builder.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-warning" type="submit">Open as this builder</button>
    </form>
    <form th:if="${builder.active}" th:action="@{/admin/builders/{id}/deactivate(id=${builder.id})}" method="post"
          onsubmit="return confirm('Deactivate this builder? They will not be able to sign in.');">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-outline-danger" type="submit">Deactivate</button>
    </form>
  </div>
</div>
</body>
</html>
