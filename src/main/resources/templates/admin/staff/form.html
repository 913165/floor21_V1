<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <h1 class="h3 mb-2" th:text="${pageTitle}">Staff</h1>
  <p class="text-muted small mb-4" th:if="${building != null}">
    Adding access for <strong th:text="${building.buildingName}">building</strong>
    (<span th:text="${builder.companyName}">builder</span>).
  </p>

  <form class="card card-body shadow-sm col-lg-8"
        th:action="@{/admin/builders/{bid}/staff/save(bid=${builder.id})}"
        th:object="${staff}" method="post" id="staff-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full name</label>
        <input class="form-control" th:field="*{fullName}" required/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email (login)</label>
        <input class="form-control" type="email" th:field="*{email}" required autocomplete="username"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="rawPassword" autocomplete="new-password"
               th:placeholder="${staff.id != null} ? 'Leave blank to keep current' : 'Required'"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Role</label>
        <select class="form-select" name="role" id="staff-role" required>
          <option value="EXECUTIVE"
                  th:selected="${staff.role == 'EXECUTIVE' or (staff.id == null and staff.role == null)}">
            Sales / partner (selected buildings)
          </option>
          <option value="BUILDER_ADMIN" th:selected="${staff.role == 'BUILDER_ADMIN'}">
            Builder admin (all buildings, vault &amp; expenses)
          </option>
        </select>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{active}"/>
          <label class="form-check-label">Active (can sign in)</label>
        </div>
      </div>
    </div>

    <div class="border-top pt-3 mt-2" id="building-access-section">
      <h6 class="mb-2">Building access</h6>
      <p class="text-muted small">
        For sales / partner users, choose which buildings they can view and edit (flats, bookings, receipts).
        Builder admins always have access to every building for this company.
      </p>
      <div th:if="${#lists.isEmpty(buildings)}" class="text-muted small">
        No buildings yet.
        <a th:href="@{/admin/builders/{id}/buildings/new(id=${builder.id})}">Add a building</a> first.
      </div>
      <div class="row g-2" th:unless="${#lists.isEmpty(buildings)}">
        <div class="col-md-6" th:each="b : ${buildings}">
          <div class="form-check">
            <input class="form-check-input building-access-cb" type="checkbox"
                   name="buildingIds" th:value="${b.id}"
                   th:id="${'bld-' + b.id}"
                   th:checked="${assignedBuildingIds != null and assignedBuildingIds.contains(b.id)}"/>
            <label class="form-check-label" th:for="${'bld-' + b.id}" th:text="${b.buildingName}">Building</label>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4 d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link"
         th:if="${building == null}"
         th:href="@{/admin/builders/{id}/staff(id=${builder.id})}">Cancel</a>
      <a class="btn btn-link"
         th:if="${building != null}"
         th:href="@{/admin/buildings/{id}/staff(id=${building.id})}">Cancel</a>
    </div>
  </form>
</div>
<script th:inline="javascript">
  (function () {
    var role = document.getElementById("staff-role");
    var section = document.getElementById("building-access-section");
    if (!role || !section) return;
    function sync() {
      var admin = role.value === "BUILDER_ADMIN";
      section.classList.toggle("opacity-50", admin);
      section.querySelectorAll(".building-access-cb").forEach(function (cb) {
        cb.disabled = admin;
        if (admin) cb.checked = false;
      });
    }
    role.addEventListener("change", sync);
    sync();
  })();
</script>
</body>
</html>
