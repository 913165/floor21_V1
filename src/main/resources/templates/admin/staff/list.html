<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <h1 class="h3 mb-0" th:text="${pageTitle}">Staff</h1>
      <p class="text-muted small mb-0" th:text="${builder.companyName}">Builder</p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-primary btn-sm" th:href="@{/admin/builders/{id}/staff/new(id=${builder.id})}">Add staff</a>
      <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/builders/{id}/edit(id=${builder.id})}">Back to builder</a>
    </div>
  </div>
  <div class="table-responsive card shadow-sm">
    <table class="table mb-0">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Last login</th><th></th></tr></thead>
      <tbody>
      <tr th:each="u : ${staff}">
        <td th:text="${u.fullName}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.role}"></td>
        <td th:text="${u.active}"></td>
        <td th:text="${u.lastLoginAt != null ? #temporals.format(u.lastLoginAt, 'dd MMM yyyy HH:mm') : 'â€”'}"></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary"
             th:href="@{/admin/builders/{bid}/staff/{uid}/edit(bid=${builder.id}, uid=${u.id})}">Edit</a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(staff)}"><td colspan="6" class="text-muted">No staff yet.</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
