<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content" th:with="cfg=${config}">
  <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <h1 class="h3 mb-2" th:text="${pageTitle}">Vault config</h1>
  <p class="text-muted small mb-4">
    Vault is <strong>off by default</strong> for everyone. Access is only what you add here: one
    <strong>user</strong> + one <strong>building</strong>, then <strong>Save</strong>.
  </p>

  <form th:action="@{/admin/vault-config}" method="post" id="vault-config-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="row g-2 align-items-end mb-3">
      <div class="col-md-5">
        <label class="form-label small" for="vault-user-picker">User</label>
        <select class="form-select" id="vault-user-picker">
          <option value="">— Select user —</option>
          <option th:each="u : ${cfg.users()}"
                  th:value="${u.id()}"
                  th:attr="data-builder-id=${u.builderId()}"
                  th:text="${u.label()}">User</option>
        </select>
      </div>
      <div class="col-md-5">
        <label class="form-label small" for="vault-building-picker">Building</label>
        <select class="form-select" id="vault-building-picker">
          <option value="">— Select building —</option>
          <option th:each="b : ${cfg.buildings()}"
                  th:value="${b.id()}"
                  th:attr="data-builder-id=${b.builderId()}"
                  th:text="${b.label()}">Building</option>
        </select>
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-outline-primary w-100" id="vault-add-btn">Add to list</button>
      </div>
    </div>

    <div id="vault-grant-inputs">
      <input type="hidden"
             th:each="g : ${cfg.grants()}"
             name="grants"
             th:value="${g.userId() + '|' + g.buildingId()}"/>
    </div>

    <div class="table-responsive border rounded mb-3">
      <table class="table table-sm mb-0">
        <thead class="table-light">
        <tr>
          <th>User</th>
          <th>Building</th>
          <th>Builder</th>
          <th class="text-end" style="width:6rem"></th>
        </tr>
        </thead>
        <tbody id="vault-grants-tbody">
        <tr th:each="g : ${cfg.grants()}"
            th:attr="data-user-id=${g.userId()},data-building-id=${g.buildingId()},
                     data-user-label=${g.userLabel()},data-building-label=${g.buildingLabel()},
                     data-builder-name=${g.builderName()}">
          <td th:text="${g.userLabel()}">User</td>
          <td th:text="${g.buildingLabel()}">Building</td>
          <td class="small text-muted" th:text="${g.builderName()}">Builder</td>
          <td class="text-end">
            <button type="button" class="btn btn-sm btn-outline-danger vault-grant-remove">Remove</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <p id="vault-grants-empty" class="text-muted small mb-3"
       th:classappend="${!#lists.isEmpty(cfg.grants())} ? 'd-none' : ''">
      No vault access rows yet.
    </p>

    <button class="btn btn-primary" type="submit">Save</button>
  </form>

  <script>
    (function () {
      const SEP = '|';
      const userPicker = document.getElementById('vault-user-picker');
      const buildingPicker = document.getElementById('vault-building-picker');
      const addBtn = document.getElementById('vault-add-btn');
      const tbody = document.getElementById('vault-grants-tbody');
      const inputsHost = document.getElementById('vault-grant-inputs');
      const emptyMsg = document.getElementById('vault-grants-empty');

      function grantKey(userId, buildingId) {
        return userId + SEP + buildingId;
      }

      function hasGrant(userId, buildingId) {
        const key = grantKey(userId, buildingId);
        return Array.from(inputsHost.querySelectorAll('input[name="grants"]')).some(function (inp) {
          return inp.value === key;
        });
      }

      function syncEmpty() {
        const n = tbody.querySelectorAll('tr[data-user-id]').length;
        emptyMsg.classList.toggle('d-none', n > 0);
      }

      function escapeHtml(t) {
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
      }

      function removeGrant(userId, buildingId) {
        const key = grantKey(userId, buildingId);
        inputsHost.querySelectorAll('input[name="grants"]').forEach(function (inp) {
          if (inp.value === key) inp.remove();
        });
        const row = tbody.querySelector(
          'tr[data-user-id="' + userId + '"][data-building-id="' + buildingId + '"]'
        );
        if (row) row.remove();
        syncEmpty();
      }

      function addGrant(userId, buildingId, userLabel, buildingLabel, builderName) {
        if (hasGrant(userId, buildingId)) return;
        const inp = document.createElement('input');
        inp.type = 'hidden';
        inp.name = 'grants';
        inp.value = grantKey(userId, buildingId);
        inputsHost.appendChild(inp);

        const tr = document.createElement('tr');
        tr.dataset.userId = userId;
        tr.dataset.buildingId = buildingId;
        tr.dataset.userLabel = userLabel;
        tr.dataset.buildingLabel = buildingLabel;
        tr.dataset.builderName = builderName;
        tr.innerHTML =
          '<td>' + escapeHtml(userLabel) + '</td>' +
          '<td>' + escapeHtml(buildingLabel) + '</td>' +
          '<td class="small text-muted">' + escapeHtml(builderName) + '</td>' +
          '<td class="text-end"><button type="button" class="btn btn-sm btn-outline-danger vault-grant-remove">Remove</button></td>';
        tbody.appendChild(tr);
        syncEmpty();
      }

      addBtn.addEventListener('click', function () {
        const userId = userPicker.value;
        const buildingId = buildingPicker.value;
        if (!userId || !buildingId) {
          alert('Select a user and a building.');
          return;
        }
        const uOpt = userPicker.selectedOptions[0];
        const bOpt = buildingPicker.selectedOptions[0];
        if (uOpt.dataset.builderId !== bOpt.dataset.builderId) {
          alert('User and building must belong to the same builder.');
          return;
        }
        const userFull = uOpt.textContent.trim();
        const buildingFull = bOpt.textContent.trim();
        const sep = ' — ';
        const builderName = userFull.includes(sep) ? userFull.split(sep)[0].trim() : '';
        const userLabel = userFull.includes(sep) ? userFull.substring(userFull.indexOf(sep) + sep.length).trim() : userFull;
        const buildingLabel = buildingFull.includes(sep)
          ? buildingFull.substring(buildingFull.indexOf(sep) + sep.length).trim()
          : buildingFull;
        addGrant(userId, buildingId, userLabel, buildingLabel, builderName);
        userPicker.value = '';
        buildingPicker.value = '';
      });

      tbody.addEventListener('click', function (e) {
        const btn = e.target.closest('.vault-grant-remove');
        if (!btn) return;
        const tr = btn.closest('tr[data-user-id]');
        if (!tr) return;
        removeGrant(tr.dataset.userId, tr.dataset.buildingId);
      });

      syncEmpty();
    })();
  </script>
</div>
</body>
</html>
