<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Milestone</h1>
  <form class="card card-body shadow-sm" th:action="@{/admin/payment-milestones/save}" th:object="${template}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" name="buildingId" th:value="${selectedBuildingId}"/>
    <input type="hidden" th:field="*{building.id}"/>

    <div class="mb-3">
      <label class="form-label" for="buildingPicker">Building</label>
      <select class="form-select" id="buildingPicker" th:field="*{building.id}" required
              th:disabled="${template.id != null}"
              th:attr="data-new-url=@{/admin/payment-milestones/new}"
              onchange="if(!this.disabled &amp;&amp; this.value){ window.location = this.getAttribute('data-new-url') + '?buildingId=' + encodeURIComponent(this.value); }">
        <option value="">Choose building…</option>
        <option th:each="b : ${buildings}"
                th:value="${b.id}"
                th:selected="${selectedBuildingId != null && selectedBuildingId == b.id}"
                th:text="${(b.builder != null ? b.builder.companyName + ' — ' : '') + b.buildingName}">Building</option>
      </select>
      <p class="form-text text-muted mb-0" th:if="${template.id != null}">Building cannot be changed when editing.</p>
    </div>

    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Sort order</label>
        <input class="form-control" type="number" th:field="*{sortOrder}" required min="0"/>
      </div>
      <div class="col-md-3">
        <label class="form-label">Percentage (optional)</label>
        <div class="input-group">
          <input class="form-control text-end" type="number" step="0.01" th:field="*{suggestedPercent}" min="0" max="100"/>
          <span class="input-group-text">%</span>
        </div>
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{active}"/>
          <label class="form-check-label">Active</label>
        </div>
      </div>
      <div class="col-12">
        <label class="form-label">Milestone description</label>
        <textarea class="form-control" rows="3" th:field="*{milestoneLabel}" required maxlength="800"
                  placeholder="e.g. On completion of the plinth work of the building"></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit" th:disabled="${selectedBuildingId == null}">Save</button>
      <a class="btn btn-link"
         th:href="@{/admin/payment-milestones(buildingId=${selectedBuildingId})}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
