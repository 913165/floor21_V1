<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Audit log</h1>
  <div class="table-responsive card shadow-sm">
    <table class="table table-sm mb-0">
      <thead>
      <tr>
        <th>When</th>
        <th>Actor</th>
        <th>Action</th>
        <th>Entity</th>
        <th>Builder</th>
        <th>Details</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="e : ${entries}">
        <td class="text-nowrap" th:text="${#temporals.format(e.createdAt, 'dd MMM yyyy HH:mm')}"></td>
        <td th:text="${e.actorEmail}"></td>
        <td th:text="${e.action}"></td>
        <td>
          <span th:text="${e.entityType}"></span>
          <span th:if="${e.entityId != null}" th:text="' #' + ${e.entityId}"></span>
        </td>
        <td th:text="${e.builderId}"></td>
        <td class="small text-muted" th:text="${e.details}"></td>
      </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
