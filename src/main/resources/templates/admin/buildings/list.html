<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">All buildings</h1>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/builders}">Builders</a>
  </div>
  <div class="table-responsive card shadow-sm">
    <table class="table table-hover mb-0">
      <thead>
      <tr>
        <th>Builder</th>
        <th>Building</th>
        <th>City</th>
        <th>Floors</th>
        <th>Active</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="b : ${buildings}">
        <td th:text="${b.builder != null ? b.builder.companyName : 'â€”'}">â€”</td>
        <td th:text="${b.buildingName}"></td>
        <td th:text="${b.city}"></td>
        <td th:text="${b.totalFloors}"></td>
        <td th:text="${b.active}"></td>
        <td class="text-end text-nowrap">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/buildings/{id}/flats(id=${b.id})}">Flats</a>
          <a class="btn btn-sm btn-outline-secondary"
             th:href="@{/admin/buildings/{id}/staff(id=${b.id})}">Partners</a>
          <a class="btn btn-sm btn-outline-secondary"
             th:if="${b.builder != null}"
             th:href="@{/admin/builders/{id}/edit(id=${b.builder.id})}">Builder</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
