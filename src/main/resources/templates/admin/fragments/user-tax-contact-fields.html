<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="taxContactFields">
  <div class="col-12">
    <h6 class="mb-0 mt-1 text-muted">Tax &amp; contact <span class="text-danger">*</span> required</h6>
  </div>
  <div class="col-md-4">
    <label class="form-label" for="user-pan">PAN <th:block th:replace="~{admin/fragments/form-required-mark :: mark}"></th:block></label>
    <input class="form-control text-uppercase" id="user-pan" th:field="*{panNumber}"
           required maxlength="10" minlength="10"
           pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]{1}"
           title="10-character PAN (e.g. ABCDE1234F)"
           placeholder="ABCDE1234F" autocomplete="off"/>
    <div class="invalid-feedback">Enter a valid 10-character PAN.</div>
  </div>
  <div class="col-md-4">
    <label class="form-label" for="user-tan">TAN <th:block th:replace="~{admin/fragments/form-required-mark :: mark}"></th:block></label>
    <input class="form-control text-uppercase" id="user-tan" th:field="*{tanNumber}"
           required maxlength="10" minlength="10"
           pattern="[A-Za-z]{4}[0-9]{5}[A-Za-z]{1}"
           title="10-character TAN (e.g. DELH12345A)"
           placeholder="DELH12345A" autocomplete="off"/>
    <div class="invalid-feedback">Enter a valid 10-character TAN.</div>
  </div>
  <div class="col-md-4">
    <label class="form-label" for="user-gst">GST number <th:block th:replace="~{admin/fragments/form-required-mark :: mark}"></th:block></label>
    <input class="form-control text-uppercase" id="user-gst" th:field="*{gstNumber}"
           required maxlength="15" minlength="15"
           pattern="[0-9]{2}[A-Za-z]{5}[0-9]{4}[A-Za-z][1-9A-Za-z]Z[0-9A-Za-z]"
           title="15-character GSTIN"
           placeholder="22AAAAA0000A1Z5" autocomplete="off"/>
    <div class="invalid-feedback">Enter a valid 15-character GSTIN.</div>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="user-mobile">Mobile number <th:block th:replace="~{admin/fragments/form-required-mark :: mark}"></th:block></label>
    <input class="form-control" id="user-mobile" th:field="*{mobileNumber}"
           type="tel" required maxlength="10" minlength="10"
           pattern="[6-9][0-9]{9}"
           title="10-digit Indian mobile number"
           placeholder="9876543210" autocomplete="tel"/>
    <div class="invalid-feedback">Enter a 10-digit mobile number starting with 6–9.</div>
  </div>
  <th:block th:replace="~{admin/fragments/user-address-fields :: addressFields}"></th:block>
</th:block>
</body>
</html>
