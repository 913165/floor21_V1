<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Client</h1>

  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <form class="card card-body shadow-sm" th:action="@{/clients/save}" th:object="${client}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>

    <th:block th:replace="~{clients/form-fields :: fields('', true)}"/>

    <div class="mt-4">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/clients}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
