<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Client</h1>
  <form class="card card-body shadow-sm" th:action="@{/clients/save}" th:object="${client}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">First name</label>
        <input class="form-control" th:field="*{firstName}" required/>
      </div>
      <div class="col-md-4">
        <label class="form-label">Last name</label>
        <input class="form-control" th:field="*{lastName}"/>
      </div>
      <div class="col-md-4">
        <label class="form-label">City</label>
        <input class="form-control" th:field="*{city}"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Mobile</label>
        <input class="form-control" th:field="*{mobile1}"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" th:field="*{email1}"/>
      </div>
      <div class="col-12">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="2" th:field="*{address1}"></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/clients}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
