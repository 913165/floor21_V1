<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Client</h1>
  <div class="card shadow-sm">
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3">Name</dt><dd class="col-sm-9" th:text="${client.displayName()}"></dd>
        <dt class="col-sm-3">City</dt><dd class="col-sm-9" th:text="${client.city}"></dd>
        <dt class="col-sm-3">Mobile</dt><dd class="col-sm-9" th:text="${client.mobile1}"></dd>
        <dt class="col-sm-3">Email</dt><dd class="col-sm-9" th:text="${client.email1}"></dd>
      </dl>
      <div class="mt-3 pt-3 border-top d-flex flex-wrap align-items-center gap-2">
        <a class="btn btn-outline-secondary" th:href="@{/clients/{id}/edit(id=${client.id})}">Edit</a>
        <th:block th:if="${!#lists.isEmpty(clientBuildings)}">
          <a class="btn btn-primary btn-sm"
             th:each="nav : ${clientBuildings}"
             th:href="@{/buildings/{bid}/flats(bid=${nav.buildingId()},focusFlat=${nav.focusFlatId()})}"
             th:text="|Flats — ${nav.buildingName()}|">Flats</a>
        </th:block>
        <a class="btn btn-link" th:href="@{/clients}">Back</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
