<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Bank account</h1>
  <form class="card card-body shadow-sm" th:action="@{/bank-accounts/save}" th:object="${bank}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Account holder name</label>
        <input class="form-control" th:field="*{accountHolderName}" maxlength="200"/>
      </div>
      <div class="col-md-4">
        <label class="form-label">Account number</label>
        <input class="form-control" th:field="*{accountNumber}" maxlength="64" autocomplete="off"/>
      </div>
      <div class="col-md-4">
        <label class="form-label">IFSC code</label>
        <input class="form-control text-uppercase" th:field="*{ifscCode}" maxlength="20" placeholder="e.g. SBIN0001234"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Bank name <span class="text-danger">*</span></label>
        <input class="form-control" th:field="*{bankName}" maxlength="200" required/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Branch</label>
        <input class="form-control" th:field="*{branch}" maxlength="200"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Used for</label>
        <select class="form-select" th:field="*{accountPurpose}">
          <optgroup label="Demand letter (required — use two separate accounts)">
            <option value="INSTALMENT">Flat cost instalment</option>
            <option value="GST">GST</option>
          </optgroup>
          <optgroup label="Other (receipt reference only)">
            <option value="RERA">RERA</option>
            <option value="PERSONAL">Personal</option>
            <option value="JOINT">Joint</option>
            <option value="CURRENT">Current account</option>
            <option value="PERSONAL_SAVINGS">Savings account</option>
            <option value="OTHERS">Others</option>
          </optgroup>
        </select>
        <div class="form-text">
          Demand letters show two bank columns: one account for <em>flat cost instalment</em> and a
          <strong>different</strong> account for <em>GST</em>. Account type on the letter (e.g. Current) is filled automatically.
        </div>
      </div>
      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea class="form-control" rows="2" th:field="*{notes}" placeholder="MICR, UPI ID, or other reference"></textarea>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{active}" id="bankActive"/>
          <label class="form-check-label" for="bankActive">Active</label>
        </div>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/bank-accounts}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
