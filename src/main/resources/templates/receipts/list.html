<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h3 mb-0" th:text="${pageTitle}">Receipts</h1>
      <div class="text-muted small" th:text="${booking.bookingCode}"></div>
    </div>
    <a class="btn btn-primary" th:href="@{/bookings/{id}/receipts/new(id=${booking.id})}">New receipt</a>
  </div>
  <div class="table-responsive card shadow-sm">
    <table class="table mb-0">
      <thead><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Bank</th></tr></thead>
      <tbody>
      <tr th:each="r : ${receipts}">
        <td th:text="${r.receiptDate}"></td>
        <td th:text="${r.amount}"></td>
        <td th:text="${r.paymentMode}"></td>
        <td th:text="${r.bankName}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(receipts)}"><td colspan="4" class="text-muted">No receipts yet</td></tr>
      </tbody>
    </table>
  </div>
  <a class="btn btn-link" th:href="@{/bookings/{id}(id=${booking.id})}">Back to booking</a>
</div>
</body>
</html>
