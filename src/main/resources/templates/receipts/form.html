<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Receipt</h1>
  <form class="card card-body shadow-sm" th:action="@{/bookings/{id}/receipts/save(id=${booking.id})}" th:object="${receipt}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Date</label>
        <input class="form-control" type="date" th:field="*{receiptDate}" required/>
      </div>
      <div class="col-md-4">
        <label class="form-label">Amount</label>
        <input class="form-control" type="number" step="0.01" th:field="*{amount}" required/>
      </div>
      <div class="col-md-4">
        <label class="form-label">Payment mode</label>
        <input class="form-control" th:field="*{paymentMode}"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Cheque no</label>
        <input class="form-control" th:field="*{chequeNo}"/>
      </div>
      <div class="col-md-6">
        <label class="form-label">Bank</label>
        <input class="form-control" th:field="*{bankName}"/>
      </div>
      <div class="col-12">
        <label class="form-label">Remarks</label>
        <textarea class="form-control" rows="2" th:field="*{remarks}"></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/bookings/{id}/receipts(id=${booking.id})}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
