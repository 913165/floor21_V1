<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Booking</h1>
  <form th:action="@{/bookings/save}" th:object="${booking}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" th:if="${booking.id != null}" th:field="*{bookingCode}"/>

    <div class="card shadow-sm mb-3">
      <div class="card-header">Flat and client</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Client</label>
            <select class="form-select" th:field="*{client.id}" required>
              <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.displayName()}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Flat</label>
            <select class="form-select" id="bookingFlatSelect" th:field="*{flat.id}" required>
              <option th:each="f : ${flats}"
                      th:value="${f.id}"
                      th:attr="data-flat-number=${f.flatNumber}"
                      th:text="${f.building.buildingName + ' — ' + f.flatNumber + ' (' + f.bhkType + ', ' + f.status + ')'}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Booking date</label>
            <input class="form-control" type="date" th:field="*{bookingDate}" required/>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-header">Booking particulars</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="bookingFlatNoDisplay">Flat no</label>
            <p class="form-control-plaintext fw-semibold mb-0 py-1 border rounded px-2 bg-body-secondary"
               id="bookingFlatNoDisplay">—</p>
            <p class="form-text small mb-0">Taken from the flat selected above.</p>
          </div>
          <div class="col-md-4">
            <label class="form-label">Consideration</label>
            <input class="form-control" type="number" step="0.01" th:field="*{considerationAmt}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Quoted amount</label>
            <input class="form-control" type="number" step="0.01" th:field="*{quotedAmount}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Broker</label>
            <select class="form-select" th:field="*{broker.id}">
              <option value="">None</option>
              <option th:each="br : ${brokers}" th:value="${br.id}" th:text="${br.fullName}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Brokerage</label>
            <input class="form-control" type="number" step="0.01" th:field="*{brokerage}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">TDS</label>
            <input class="form-control" type="number" step="0.01" th:field="*{tds}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">GST</label>
            <input class="form-control" type="number" step="0.01" th:field="*{gst}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Final</label>
            <input class="form-control" type="number" step="0.01" th:field="*{finalAmount}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Due amount date</label>
            <input class="form-control" type="date" th:field="*{dueAmountDate}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Booking intimation date</label>
            <input class="form-control" type="date" th:field="*{bookingIntimationDate}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">NOC request date</label>
            <input class="form-control" type="date" th:field="*{nocRequestDate}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Market value</label>
            <input class="form-control" type="number" step="0.01" th:field="*{marketValue}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Executive name</label>
            <select class="form-select" th:field="*{executive.id}">
              <option value="">None</option>
              <option th:each="u : ${executives}" th:value="${u.id}" th:text="${u.fullName + ' (' + u.role + ')'}"></option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Parking info</label>
            <textarea class="form-control" rows="2" th:field="*{parkingInfo}"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Reference</label>
            <textarea class="form-control" rows="2" th:field="*{reference}"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Scheme</label>
            <input class="form-control" th:field="*{scheme}" maxlength="100"/>
          </div>
          <div class="col-md-6 d-flex align-items-end">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" th:field="*{bareFlat}" id="bareFlat"/>
              <label class="form-check-label" for="bareFlat">Bare flat</label>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">General particulars</label>
            <textarea class="form-control" rows="3" th:field="*{particulars}"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-header">Registration information</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Stamp duty amount</label>
            <input class="form-control" type="number" step="0.01" th:field="*{stampDutyAmount}"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Registration amount</label>
            <input class="form-control" type="number" step="0.01" th:field="*{registrationAmount}"/>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="submit"
              th:text="${booking.id != null} ? 'Modify particulars' : 'Create booking'">Save</button>
      <a class="btn btn-link" th:href="${booking.id != null} ? @{/bookings/{id}(id=${booking.id})} : @{/bookings}">Cancel</a>
    </div>
  </form>
  <script>
    (function () {
      var flatSelect = document.getElementById('bookingFlatSelect');
      var display = document.getElementById('bookingFlatNoDisplay');
      if (!flatSelect || !display) {
        return;
      }
      function syncFlatNo() {
        var opt = flatSelect.options[flatSelect.selectedIndex];
        var flatNo = opt && opt.getAttribute('data-flat-number');
        display.textContent = flatNo && flatNo.trim() ? flatNo.trim() : '—';
      }
      flatSelect.addEventListener('change', syncFlatNo);
      syncFlatNo();
    })();
  </script>
</div>
</body>
</html>
