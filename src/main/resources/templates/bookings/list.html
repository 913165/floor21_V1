<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content" th:with="dfmt=${T(com.floor21.util.Floor21DateFormatter)}">
  <div class="alert alert-info py-2" th:if="${platformAdminView}">
    Read-only for platform admin. Filter by project or search across all bookings.
  </div>
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">Bookings</h1>
    <div class="d-flex flex-wrap align-items-center gap-2">
      <form class="d-flex align-items-center gap-2" method="get" th:action="@{/bookings}"
            id="bookings-page-size-form"
            data-turbo-frame="floor21-main" data-turbo-action="advance">
        <input type="hidden" name="page" value="0"/>
        <input type="hidden" name="q" th:if="${filterSearch != null and !#strings.isEmpty(filterSearch)}" th:value="${filterSearch}"/>
        <input type="hidden" name="projectId" th:if="${filterProjectId != null}" th:value="${filterProjectId}"/>
        <label class="form-label small text-muted mb-0" for="bookings-page-size">Per page</label>
        <select class="form-select form-select-sm" id="bookings-page-size" name="size"
                style="width: auto" onchange="this.form.submit()">
          <option th:each="opt : ${pageSizeOptions}"
                  th:value="${opt}"
                  th:text="${opt}"
                  th:selected="${pageSize == opt}">25</option>
        </select>
      </form>
      <a class="btn btn-primary" th:unless="${readonlyView}" th:href="@{/bookings/new}">New booking</a>
    </div>
  </div>
  <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/bookings}"
        th:if="${platformAdminView}"
        data-turbo-frame="floor21-main" data-turbo-action="advance">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${pageSize}"/>
    <div class="col-md-4 col-lg-3">
      <label class="form-label small mb-1" for="filterProject">Project</label>
      <select class="form-select form-select-sm" id="filterProject" name="projectId"
              data-project-search-select data-submit-on-select="true">
        <option value="">All projects</option>
        <option th:each="p : ${projects}"
                th:value="${p.id}"
                th:text="${p.companyName}"
                th:selected="${filterProjectId != null and filterProjectId == p.id}"></option>
      </select>
    </div>
    <div class="col-md-5 col-lg-4">
      <label class="form-label small mb-1" for="booking-search-q">Search</label>
      <input class="form-control form-control-sm" id="booking-search-q" name="q" th:value="${filterSearch}"
             placeholder="Code, client, flat, building, project" autocomplete="off" spellcheck="false"/>
    </div>
    <div class="col-auto">
      <button class="btn btn-primary btn-sm" type="submit">Filter</button>
      <a class="btn btn-outline-secondary btn-sm"
         th:href="@{/bookings(size=${pageSize})}"
         th:if="${filterProjectId != null or (filterSearch != null and !#strings.isEmpty(filterSearch))}">Clear</a>
    </div>
  </form>

  <div class="table-responsive card shadow-sm">
    <table class="table table-hover mb-0">
      <thead>
      <tr>
        <th th:if="${platformAdminView}">Project</th>
        <th>Code</th>
        <th>Date</th>
        <th>Client</th>
        <th>Building</th>
        <th>Flat</th>
        <th>Status</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="b : ${bookings}">
        <td th:if="${platformAdminView}"
            th:text="${b.builder != null ? b.builder.companyName : '—'}"></td>
        <td th:text="${b.bookingCode}"></td>
        <td th:text="${dfmt.formatDisplay(b.bookingDate)}"></td>
        <td th:text="${b.client.displayName()}"></td>
        <td>
          <a th:if="${b.flat != null and b.flat.building != null}"
             class="link-primary"
             th:href="@{/buildings/{bid}/flats(bid=${b.flat.building.id})}"
             th:text="${b.flat.building.buildingName}">Tower A</a>
          <span th:unless="${b.flat != null and b.flat.building != null}">—</span>
        </td>
        <td>
          <a th:if="${b.flat != null and b.flat.building != null}"
             class="link-primary"
             th:href="@{/buildings/{bid}/flats(bid=${b.flat.building.id},focusFlat=${b.flat.id})}"
             th:text="${b.flat.flatNumber}">0802</a>
          <span th:if="${b.flat == null or b.flat.building == null}"
                th:text="${b.flat != null ? b.flat.flatNumber : '—'}">—</span>
        </td>
        <td th:text="${b.status}"></td>
        <td class="text-end text-nowrap">
          <a class="btn btn-sm btn-outline-primary"
             th:href="@{/bookings/{id}(id=${b.id}, projectId=${filterProjectId})}">View</a>
          <form class="d-inline" th:if="${!readonlyView and b.status == 'CANCELLED'}"
                th:action="@{/bookings/{id}/remove(id=${b.id})}" method="post"
                th:attr="onsubmit=|return confirm('Remove booking ${b.bookingCode} permanently? This cannot be undone.');|">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(bookings)}">
        <td th:colspan="${platformAdminView ? 8 : 7}"
            class="text-muted text-center py-4">No bookings found.</td>
      </tr>
      </tbody>
    </table>
  </div>

  <nav class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-3"
       th:if="${bookingPage != null and bookingPage.totalElements > 0}"
       aria-label="Bookings pagination">
    <p class="text-muted small mb-0">
      Showing
      <strong th:text="${bookingPage.number * bookingPage.size + 1}">1</strong>
      to
      <strong th:text="${bookingPage.number * bookingPage.size + bookingPage.numberOfElements}">25</strong>
      of <strong th:text="${bookingPage.totalElements}">0</strong>
    </p>
    <ul class="pagination pagination-sm mb-0" th:if="${bookingPage.totalPages > 1}">
      <li class="page-item" th:classappend="${!bookingPage.hasPrevious()} ? 'disabled'">
        <a class="page-link"
           th:if="${bookingPage.hasPrevious()}"
           th:href="@{/bookings(page=${bookingPage.number - 1}, size=${pageSize}, q=${filterSearch}, projectId=${filterProjectId})}">Previous</a>
        <span class="page-link" th:unless="${bookingPage.hasPrevious()}">Previous</span>
      </li>
      <li class="page-item disabled">
        <span class="page-link"
              th:text="|Page ${bookingPage.number + 1} of ${bookingPage.totalPages}|">Page 1 of 1</span>
      </li>
      <li class="page-item" th:classappend="${!bookingPage.hasNext()} ? 'disabled'">
        <a class="page-link"
           th:if="${bookingPage.hasNext()}"
           th:href="@{/bookings(page=${bookingPage.number + 1}, size=${pageSize}, q=${filterSearch}, projectId=${filterProjectId})}">Next</a>
        <span class="page-link" th:unless="${bookingPage.hasNext()}">Next</span>
      </li>
    </ul>
  </nav>
</div>
</body>
</html>
