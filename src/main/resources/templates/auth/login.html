<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <th:block th:replace="~{layout/fragments/theme-head :: themeScript}"/>
  <title>Login | Floor21</title>
  <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/floor21.css(v=password-toggle)}"/>
</head>
<body class="bg-body d-flex flex-column" style="min-height:100vh">
<div class="container py-3" style="max-width:420px">
  <div class="d-flex justify-content-end align-items-center mb-3">
    <th:block th:replace="~{layout/fragments/theme-toggle :: themeToggle(false)}"/>
  </div>
  <h1 class="h3 mb-4 text-center">Floor21</h1>
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
      <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="username" required autocomplete="username"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" required autocomplete="current-password"/>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <p class="text-muted small mt-3 mb-0">Demo: super@floor21.com / super123 · admin@skylinehomes.com / admin123</p>
    </div>
  </div>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script defer th:src="@{/js/theme.js}"></script>
<script defer th:src="@{/js/password-toggle.js(v=password-toggle)}"></script>
</body>
</html>
