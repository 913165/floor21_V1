<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4" th:text="${pageTitle}">Vault entry</h1>
  <form class="card card-body shadow-sm" th:action="@{/vault/save}" th:object="${entry}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Client name <span class="text-danger">*</span></label>
        <input class="form-control" th:field="*{clientName}" maxlength="200" required
               placeholder="Who paid / source"/>
      </div>
      <div class="col-md-3">
        <label class="form-label">Amount <span class="text-danger">*</span></label>
        <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{amount}" required/>
      </div>
      <div class="col-md-3">
        <label class="form-label">Date <span class="text-danger">*</span></label>
        <input class="form-control" type="date" th:field="*{entryDate}" required/>
      </div>
      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea class="form-control" rows="2" th:field="*{notes}" placeholder="Optional"></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" th:href="@{/vault}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
