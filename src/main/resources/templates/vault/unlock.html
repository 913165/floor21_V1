<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <h1 class="h3 mb-2" th:text="${pageTitle}">Vault</h1>
      <p class="text-muted small mb-4">
        Enter your PIN to continue. Access stays unlocked for
        <span th:text="${unlockTimeoutMinutes}">15</span> minutes.
      </p>
      <div class="card shadow-sm">
        <div class="card-body">
          <form th:action="@{/vault/unlock}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="redirect" th:value="${redirectPath}"/>

            <div class="mb-3">
              <label class="form-label">PIN</label>
              <input class="form-control" type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,8}"
                     maxlength="8" autocomplete="off" required autofocus/>
            </div>

            <button class="btn btn-primary w-100" type="submit">Unlock</button>
          </form>
          <p class="small text-center mt-3 mb-0">
            <a th:href="@{/vault/pins}">Change PIN</a>
          </p>
        </div>
      </div>
      <a class="btn btn-link btn-sm mt-2 px-0" th:href="@{/dashboard}">Back to dashboard</a>
    </div>
  </div>
</div>
</body>
</html>
