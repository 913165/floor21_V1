<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <h1 class="h3 mb-2" th:text="${pageTitle}">Vault access</h1>
      <p class="text-muted small mb-4">
        The vault is separate from your login. Only builder administrators can open it.
        Access stays unlocked for <span th:text="${unlockTimeoutMinutes}">15</span> minutes after you enter the PIN.
      </p>
      <div class="card shadow-sm">
        <div class="card-body">
          <form th:action="@{/vault/unlock}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="redirect" th:value="${redirectPath}"/>

            <th:block th:if="${pinSetupRequired}">
              <p class="small text-warning mb-3">Create your vault PIN (4-8 digits). You will use this each time you open the vault.</p>
              <div class="mb-3">
                <label class="form-label">New vault PIN</label>
                <input class="form-control" type="password" name="newPin" inputmode="numeric" pattern="[0-9]{4,8}"
                       maxlength="8" autocomplete="new-password" required/>
              </div>
              <div class="mb-3">
                <label class="form-label">Confirm PIN</label>
                <input class="form-control" type="password" name="confirmPin" inputmode="numeric" pattern="[0-9]{4,8}"
                       maxlength="8" autocomplete="new-password" required/>
              </div>
            </th:block>

            <th:block th:unless="${pinSetupRequired}">
              <div class="mb-3">
                <label class="form-label">Vault PIN</label>
                <input class="form-control" type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,8}"
                       maxlength="8" autocomplete="off" required autofocus/>
              </div>
            </th:block>

            <button class="btn btn-primary w-100" type="submit"
                    th:text="${pinSetupRequired} ? 'Create PIN and open vault' : 'Unlock vault'">Unlock</button>
          </form>
        </div>
      </div>
      <a class="btn btn-link btn-sm mt-2 px-0" th:href="@{/dashboard}">Back to dashboard</a>
    </div>
  </div>
</div>
</body>
</html>
