<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">Vault</h1>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-primary" th:href="@{/vault/new}">New entry</a>
      <a class="btn btn-outline-secondary" th:href="@{/vault/change-pin}">Change PIN</a>
      <form class="m-0" th:action="@{/vault/lock}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-outline-warning" type="submit">Lock vault</button>
      </form>
    </div>
  </div>
  <p class="text-muted small mb-3">
    Private cash-in records (not shown on receipts or bookings). Unlocks for
    <span th:text="${unlockTimeoutMinutes}">15</span> minutes per PIN session.
  </p>
  <div class="card shadow-sm mb-3 border-secondary border-opacity-25">
    <div class="card-body py-2 d-flex justify-content-between align-items-center">
      <span class="text-muted small">Total recorded</span>
      <strong class="fs-5" th:text="${totalAmount}">0</strong>
    </div>
  </div>
  <div class="table-responsive card shadow-sm">
    <table class="table table-hover table-sm mb-0 align-middle">
      <thead class="table-light">
      <tr>
        <th>Date</th>
        <th>Client name</th>
        <th class="text-end">Amount</th>
        <th>Notes</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="e : ${entries}">
        <td class="text-nowrap" th:text="${e.entryDate}"></td>
        <td th:text="${e.clientName}"></td>
        <td class="text-end" th:text="${e.amount}"></td>
        <td class="small text-muted"
            th:text="${(e.notes != null && !#strings.isEmpty(e.notes)) ? e.notes : '—'}">—</td>
        <td class="text-end text-nowrap">
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/vault/{id}/edit(id=${e.id})}">Edit</a>
          <form class="d-inline" th:action="@{/vault/{id}/delete(id=${e.id})}" method="post"
                onsubmit="return confirm('Remove this vault entry?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(entries)}">
        <td colspan="5" class="text-muted text-center py-4">No vault entries yet.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
