<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">Buildings</h1>
    <a class="btn btn-primary" sec:authorize="hasRole('SUPER_ADMIN')" th:href="@{/admin/projects}">
      Projects
    </a>
  </div>
  <p class="text-muted small mb-3" sec:authorize="hasRole('BUILDER_ADMIN') and !hasRole('SUPER_ADMIN')">
    Your project may include multiple buildings, each with its own layout and flat grid.
    New buildings are added by the Floor21 platform administrator.
  </p>
  <div class="table-responsive card shadow-sm">
    <table class="table table-hover mb-0">
      <thead>
      <tr>
        <th th:if="${platformAdminView}">Builder</th>
        <th>Layout ID</th>
        <th>Name</th>
        <th>City</th>
        <th>Floors</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="b : ${buildings}"
          th:attr="data-building-id=${b.id}, data-building-name=${b.buildingName}">
        <td th:if="${platformAdminView}" th:text="${b.builder != null ? b.builder.companyName : '—'}">—</td>
        <td class="font-monospace small text-muted">
          <span th:title="${b.id}"
                th:text="${#strings.toUpperCase(#strings.substring(b.id.toString(), 0, 8))}">A1B2C3D4</span>
        </td>
        <td th:text="${b.buildingName}"></td>
        <td th:text="${b.city}"></td>
        <td th:text="${b.totalFloors}"></td>
        <td class="text-end text-nowrap">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/buildings/{id}/flats(id=${b.id})}">Flats</a>
          <a class="btn btn-sm btn-outline-secondary"
             th:if="${bookingCounts[b.id] == null or bookingCounts[b.id] == 0}"
             th:href="@{/buildings/{id}/edit(id=${b.id})}">Edit layout</a>
          <span class="text-muted small"
                th:if="${bookingCounts[b.id] != null and bookingCounts[b.id] > 0}"
                title="Layout is locked while bookings exist.">Layout locked</span>
          <a class="btn btn-sm btn-outline-secondary"
             th:if="${platformAdminView and b.builder != null}"
             th:href="@{/admin/projects/{id}/edit(id=${b.builder.id})}">Project</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
