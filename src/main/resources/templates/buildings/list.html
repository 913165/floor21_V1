<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h1 class="h3 mb-0" th:text="${pageTitle}">Buildings</h1>
    <a class="btn btn-primary" sec:authorize="hasRole('SUPER_ADMIN')" th:href="@{/admin/builders}">
      Add building (via builder)
    </a>
  </div>
  <p class="text-muted small mb-3" sec:authorize="hasRole('BUILDER_ADMIN') and !hasRole('SUPER_ADMIN')">
    New buildings are registered by the Floor21 platform administrator. You can edit existing buildings and manage flats.
  </p>
  <div class="table-responsive card shadow-sm">
    <table class="table table-hover mb-0">
      <thead>
      <tr>
        <th th:if="${platformAdminView}">Builder</th>
        <th>Name</th>
        <th>City</th>
        <th>Floors</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="b : ${buildings}">
        <td th:if="${platformAdminView}" th:text="${b.builder != null ? b.builder.companyName : '—'}">—</td>
        <td th:text="${b.buildingName}"></td>
        <td th:text="${b.city}"></td>
        <td th:text="${b.totalFloors}"></td>
        <td class="text-end text-nowrap">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/buildings/{id}/flats(id=${b.id})}">Flats</a>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/buildings/{id}/edit(id=${b.id})}">Edit</a>
          <a class="btn btn-sm btn-outline-secondary"
             th:if="${platformAdminView and b.builder != null}"
             th:href="@{/admin/builders/{id}/edit(id=${b.builder.id})}">Builder</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
