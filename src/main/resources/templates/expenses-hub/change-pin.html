<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-2" th:text="${pageTitle}">Change expenses PIN</h1>
  <p class="text-muted small mb-3">You can change your expenses PIN without unlocking the expenses list.</p>

  <div th:replace="~{expenses-hub/fragments/pin-requirements :: pinRequirements}"></div>

  <form class="card card-body shadow-sm col-lg-5" th:action="@{/expenses/change-pin}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="mb-3">
      <label class="form-label">Current PIN</label>
      <input class="form-control" type="password" name="currentPin" inputmode="numeric" pattern="[0-9]{4,8}"
             maxlength="8" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">New PIN</label>
      <input class="form-control" type="password" name="newPin" inputmode="numeric" pattern="[0-9]{4,8}"
             maxlength="8" required/>
      <div class="form-text" th:text="${pinRequirementsHint}">4–8 digits</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm new PIN</label>
      <input class="form-control" type="password" name="confirmPin" inputmode="numeric" pattern="[0-9]{4,8}"
             maxlength="8" required/>
    </div>
    <button class="btn btn-primary" type="submit">Update PIN</button>
    <a class="btn btn-link" th:href="@{/expenses}">Back to expenses</a>
  </form>
  <p class="small mt-3 mb-0">
    <a th:href="@{/expenses/reset-pin(redirect='/expenses')}">Forgot expenses PIN? Reset with login password</a>
  </p>
</div>
</body>
</html>
