<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4">Change password</h1>
  <p class="text-muted small mb-3">Use at least 8 characters. This updates your Floor21 login password.</p>
  <form class="card card-body shadow-sm col-lg-5" th:action="@{/profile/change-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="mb-3">
      <label class="form-label">Current password</label>
      <input class="form-control" type="password" name="currentPassword" autocomplete="current-password" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">New password</label>
      <input class="form-control" type="password" name="newPassword" autocomplete="new-password" minlength="8" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm new password</label>
      <input class="form-control" type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required/>
    </div>
    <button class="btn btn-primary" type="submit">Update password</button>
    <a class="btn btn-link" th:href="@{/profile}">Cancel</a>
  </form>
</div>
</body>
</html>
