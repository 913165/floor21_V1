<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1 class="h3 mb-4">My profile</h1>

  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card card-body shadow-sm h-100">
        <h2 class="h6 text-muted text-uppercase mb-3">Account</h2>
        <dl class="row mb-0 small">
          <dt class="col-sm-4">Name</dt>
          <dd class="col-sm-8" th:text="${profile.displayName()}">—</dd>
          <dt class="col-sm-4">Email</dt>
          <dd class="col-sm-8" th:text="${profile.email()}">—</dd>
          <dt class="col-sm-4">Role</dt>
          <dd class="col-sm-8" th:text="${profile.roleLabel()}">—</dd>
          <dt class="col-sm-4" th:if="${profile.companyName() != null}">Company</dt>
          <dd class="col-sm-8" th:if="${profile.companyName() != null}" th:text="${profile.companyName()}">—</dd>
        </dl>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card card-body shadow-sm h-100">
        <h2 class="h6 text-muted text-uppercase mb-3">Security</h2>
        <ul class="list-unstyled mb-0">
          <li class="mb-0">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/profile/change-password}">Change login password</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
