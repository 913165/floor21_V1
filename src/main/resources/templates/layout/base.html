<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout (content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' | Floor21'">Floor21</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/floor21.css}"/>
</head>
<body class="bg-light floor21-body d-flex flex-column min-vh-100" th:attr="data-app-root=@{/}">
<header th:replace="~{layout/fragments/navbar :: navbar}"></header>
<div class="floor21-shell d-flex flex-grow-1 w-100 min-vh-0">
  <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
  <main class="floor21-panel flex-grow-1 py-3 px-3 px-md-4 overflow-auto">
    <div th:replace="~{layout/fragments/flash-messages :: flash}"></div>
    <div th:replace="${content}"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer th:src="@{/js/flat-grid.js}"></script>
</body>
</html>
