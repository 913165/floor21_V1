<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
      th:fragment="layout (content)">
<head>
  <meta charset="UTF-8"/>
  <th:block th:replace="~{layout/fragments/theme-head :: themeScript}"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} + ' | Floor21'">Floor21</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/floor21.css(v=profile-dropdown)}"/>
  <link rel="stylesheet" th:href="@{/css/floor21-chrome.css(v=profile-dropdown)}"/>
</head>
<body class="floor21-body d-flex flex-column min-vh-100 bg-body"
      th:attr="data-app-root=@{/}, data-nav-area=${navArea != null ? navArea : 'overview'}">
<header th:replace="~{layout/fragments/navbar :: navbar}"></header>
<div th:if="${impersonationActive}" class="floor21-impersonation-banner text-center small py-2 px-3">
  Viewing as <strong th:text="${impersonationBuilderName}">builder</strong>.
  <form class="d-inline ms-2" th:action="@{/impersonate/end}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button class="btn btn-sm btn-warning" type="submit">End impersonation</button>
  </form>
</div>
<div class="floor21-shell d-flex flex-grow-1 w-100 min-vh-0">
  <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
  <main class="floor21-panel flex-grow-1 py-3 px-3 px-md-4 overflow-auto">
    <div th:replace="~{layout/fragments/flash-messages :: flash}"></div>
    <div th:replace="${content}"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer th:src="@{/js/layout.js(v=profile-dropdown)}"></script>
<script defer th:src="@{/js/theme.js}"></script>
<script defer th:src="@{/js/flat-grid.js}"></script>
</body>
</html>
