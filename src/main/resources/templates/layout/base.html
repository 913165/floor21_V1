<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en"
      th:fragment="layout (content)">
<head>
  <meta charset="UTF-8"/>
  <th:block th:replace="~{layout/fragments/theme-head :: branding}"/>
  <th:block th:replace="~{layout/fragments/theme-head :: themeScript}"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
  <meta name="floor21-nav-path" th:content="${navServletPath}"/>
  <meta name="floor21-nav-area" th:content="${navArea != null ? navArea : 'overview'}"/>
  <meta name="floor21-session-timeout-seconds" th:content="${sessionTimeoutSeconds}"/>
  <meta name="turbo-cache-control" content="no-preview"/>
  <title th:text="${pageTitle} + ' | Floor21'">Floor21</title>
  <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/floor21.css(v=project-search-v1)}"/>
  <link rel="stylesheet" th:href="@{/css/floor21-chrome.css(v=turbo-frame)}"/>
  <link rel="stylesheet" th:href="@{/css/floor21-turbo.css(v=turbo-frame)}"/>
  <script th:src="@{/vendor/turbo.min.js}"></script>
  <script th:src="@{/js/session-auth.js(v=session-relogin2)}"></script>
</head>
<body class="floor21-body d-flex flex-column min-vh-100 bg-body"
      th:attr="data-app-root=@{/}, data-nav-area=${navArea != null ? navArea : 'overview'}">
<header th:replace="~{layout/fragments/navbar :: navbar}"></header>
<div class="floor21-shell d-flex flex-grow-1 w-100 min-vh-0">
  <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
  <turbo-frame id="floor21-main" data-turbo-action="advance"
               class="floor21-panel flex-grow-1 py-3 px-3 px-md-4 overflow-auto">
    <div class="floor21-panel__inner">
      <div th:if="${impersonationActive}" class="floor21-impersonation-banner floor21-impersonation-banner--inline text-center small py-2 px-3 mb-3">
        Viewing as <strong th:text="${impersonationStaffName}">partner</strong>
        on <strong th:text="${impersonationBuilderName}">project</strong>.
        <form class="d-inline ms-2" th:action="@{/impersonate/end}" method="post" data-turbo="false">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-sm btn-warning" type="submit">End impersonation</button>
        </form>
      </div>
      <div th:replace="~{layout/fragments/flash-messages :: flash}"></div>
      <div th:replace="${content}"></div>
    </div>
  </turbo-frame>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
  <script defer th:src="@{/js/turbo-drive.js(v=frame-advance)}"></script>
<script defer th:src="@{/js/nav-active.js(v=frame-advance)}"></script>
<script defer th:src="@{/js/project-search-select.js(v=project-search-v3)}"></script>
<script defer th:src="@{/js/admin-list-filters.js(v=1)}"></script>
<script defer th:src="@{/js/layout.js(v=turbo-frame)}"></script>
<script defer th:src="@{/js/password-toggle.js(v=turbo-frame)}"></script>
<script defer th:src="@{/js/theme.js(v=turbo-frame)}"></script>
</body>
</html>
