<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-dark floor21-topbar navbar-expand-lg flex-shrink-0">
  <div class="container-fluid px-3">
    <a class="navbar-brand floor21-topbar__brand" th:href="@{/dashboard}" title="Home — Dashboard">
      <span class="floor21-topbar__mark" aria-hidden="true">F21</span>
      <span class="floor21-topbar__brand-name">Floor21</span>
    </a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <th:block th:replace="~{layout/fragments/theme-controls :: themeControls}"/>
      <div class="dropdown floor21-profile-menu" sec:authorize="isAuthenticated()">
        <button class="btn btn-outline-light btn-sm dropdown-toggle floor21-profile-menu__toggle"
                type="button"
                id="profileMenu"
                data-bs-toggle="dropdown"
                aria-expanded="false">
          <span class="floor21-profile-menu__avatar" aria-hidden="true"
                th:text="${navAccountInitial != null and !#strings.isEmpty(navAccountInitial)} ? ${navAccountInitial} : '?'">?</span>
          <span class="floor21-profile-menu__label d-none d-md-inline"
                th:text="${navAccountLabel != null ? navAccountLabel : 'Account'}">Account</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow floor21-profile-menu__panel"
            aria-labelledby="profileMenu">
          <li class="dropdown-header small text-truncate" style="max-width: 14rem;"
              th:text="${navAccountEmail != null ? navAccountEmail : ''}">user@example.com</li>
          <li><hr class="dropdown-divider"/></li>
          <li><a class="dropdown-item" th:href="@{/profile}">My profile</a></li>
          <li><a class="dropdown-item" th:href="@{/profile/change-password}">Change password</a></li>
          <li sec:authorize="hasRole('BUILDER_ADMIN')"><hr class="dropdown-divider"/></li>
          <li sec:authorize="hasRole('BUILDER_ADMIN')">
            <a class="dropdown-item" th:href="@{/vault/change-pin}">Vault PIN</a>
          </li>
          <li><hr class="dropdown-divider"/></li>
          <li>
            <form class="m-0 px-2 pb-1" th:action="@{/logout}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button class="dropdown-item text-danger rounded" type="submit">Log out</button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
</body>
</html>
