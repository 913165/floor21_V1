<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-dark floor21-topbar navbar-expand-lg flex-shrink-0">
  <div class="container-fluid px-3">
    <a class="navbar-brand floor21-topbar__brand" th:href="@{/dashboard}">
      <span class="floor21-topbar__mark" aria-hidden="true">F21</span>
      <span>Floor21</span>
    </a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <th:block th:replace="~{layout/fragments/theme-controls :: themeControls}"/>
      <span class="text-white-50 small" sec:authentication="name"></span>
      <form class="m-0" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>
</body>
</html>
