<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar" class="floor21-sidebar border-end bg-body py-3 px-2 d-none d-md-block flex-shrink-0">
  <div class="list-group list-group-flush small">
    <a class="list-group-item list-group-item-action" th:href="@{/dashboard}">Dashboard</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/buildings}">Buildings</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/clients}">Clients</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/payment-milestones}">Payment milestones</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/bookings}">Bookings</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/receipts}">Receipts entry</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/bank-accounts}">Bank accounts</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasRole('BUILDER_ADMIN')"
       th:href="@{/vault}">Vault</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/bookings/payment-schedule}"
       title="View your payment milestones and set slab dates, %, and amounts for each booking">Slabs (payment schedule)</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/brokers}">Brokers</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasAnyRole('BUILDER_ADMIN','EXECUTIVE')"
       th:href="@{/cancellations}">Cancellations</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasRole('SUPER_ADMIN')"
       th:href="@{/admin/builders}">Admin — Builders</a>
    <a class="list-group-item list-group-item-action" sec:authorize="hasRole('SUPER_ADMIN')"
       th:href="@{/admin/builder-pricing-slabs}">Admin — Builder rate slabs</a>

</html>
