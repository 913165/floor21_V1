# Default stack: Postgres + monitoring. Run Spring Boot locally (mvnw spring-boot:run).
# Optional containerized app: docker compose -f docker-compose.yml -f docker-compose.app.yml up --build

services:
  postgres:
    image: postgres:16
    container_name: floor21_postgres
    environment:
      POSTGRES_DB: floor21_db
      POSTGRES_USER: floor21_user
      POSTGRES_PASSWORD: floor21_pass
    ports:
      - "5432:5432"
    volumes:
      - floor21_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floor21_user -d floor21_db"]
      interval: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: floor21_prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.5.2
    container_name: floor21_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: floor21
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  floor21_pgdata:
