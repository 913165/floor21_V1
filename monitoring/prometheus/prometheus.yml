global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: floor21
    metrics_path: /floor21/actuator/prometheus
    scrape_interval: 15s
    static_configs:
      # Spring Boot on host (mvnw spring-boot:run) — default docker-compose.yml
      - targets: ["host.docker.internal:8080"]
        labels:
          application: floor21
